    <nav class="navbar">
        <div class="navbar__logo">Upgrade Timer Calc</div>

    <main class="container">
        <h1 class="title">Simple Calculator</h1>
        <div class="split-layout">
            <div class="split-layout__left">
                <form id="simpleCalcForm" class="form card card--content">
                    <div class="form__row">
                        <div class="form__group">
                            <label for="days" class="form__label">Days</label>
                            <input type="number" class="form__input" inputmode="none" readonly id="days" name="days" min="0" value="" placeholder="0">
                        </div>
                        <div class="form__group">
                            <label for="hours" class="form__label">Hours</label>
                            <input type="number" class="form__input" inputmode="none" readonly id="hours" name="hours" min="0" max="23" value="" placeholder="0">
                        </div>
                        <div class="form__group">
                            <label for="minutes" class="form__label">Minutes</label>
                            <input type="number" class="form__input" inputmode="none" readonly id="minutes" name="minutes" min="0" max="59" value="" placeholder="0">
                        </div>
                    </div>
                    <button type="submit" class="btn btn--primary btn--animated">Calculate</button>
                </form>
            </div>
            <div class="split-layout__right">
                <div id="simpleCalcResult" class="result card card--result">
                    <div class="result__placeholder">
                        <svg class="result__icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                            <circle cx="24" cy="24" r="17" fill="none" stroke="currentColor" stroke-width="3" />
                            <path d="M24 24V13M24 24l8 5" fill="none" stroke="currentColor" stroke-width="3"
                                stroke-linecap="round" />
                            <circle cx="24" cy="24" r="2.6" fill="currentColor" />
                        </svg>
                        <div class="result__text">
                            Enter a duration and click Calculate.<br>
                            The result will appear here!
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
